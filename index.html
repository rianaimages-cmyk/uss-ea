<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USS — Doorix Homepage Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f6}iframe{display:block;width:100%;height:100%;border:0;background:#f4f7f6}
</style>
</head>
<body>
<iframe id="site" src="/doorix-v2.html" title="USS homepage preview"></iframe>
<script>
const logos=[
['https://www.uss-ea.com/wp-content/uploads/2022/03/25.png.webp','USS client'],
['https://www.uss-ea.com/wp-content/uploads/2022/04/8Coca-Cola.png','Coca-Cola'],
['https://www.uss-ea.com/wp-content/uploads/2022/03/15.png.webp','USS client'],
['https://www.uss-ea.com/wp-content/uploads/2022/03/26.png.webp','USS client'],
['https://www.uss-ea.com/wp-content/uploads/2022/03/logo-1.png.webp','USS client'],
['https://www.uss-ea.com/wp-content/uploads/2022/04/BBS.jpg.webp','BBS'],
['https://www.uss-ea.com/wp-content/uploads/2022/04/BIDCO.jpg.webp','BIDCO'],
['https://www.uss-ea.com/wp-content/uploads/2022/04/dusitD2.jpg.webp','dusitD2'],
['https://www.uss-ea.com/wp-content/uploads/2026/08/FINNEY-1110x500.jpeg','Finney Hospital'],
['https://www.uss-ea.com/wp-content/uploads/2026/08/AMC-1110x500.jpeg','Accra Medical Centre'],
['https://www.uss-ea.com/wp-content/uploads/2026/08/WORLD-BNK-1110x500.jpeg','World Bank']
];
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const st=d.createElement('style');
  st.textContent=`
    .trust{padding:30px 0!important}
    .trustrow,.trust-row{grid-template-columns:120px minmax(0,1fr) 145px!important;gap:30px!important}
    .logo-marquee{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
    .logo-track{display:flex;align-items:center;width:max-content;gap:38px;animation:ussClientMarquee 34s linear infinite}
    .logo-marquee:hover .logo-track{animation-play-state:paused}
    .client-logo{height:42px;width:118px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .client-logo img{max-width:100%;max-height:34px;width:auto!important;height:auto!important;object-fit:contain!important;filter:grayscale(1);opacity:.66;transition:.25s;mix-blend-mode:multiply}
    .client-logo:hover img{filter:grayscale(0);opacity:1;transform:scale(1.04)}
    .brand img{width:88px!important;height:42px!important;object-fit:contain!important;background:#fff;border-radius:8px;padding:4px 6px}
    @keyframes ussClientMarquee{to{transform:translateX(-50%)}}
    @media(max-width:700px){.trustrow,.trust-row{grid-template-columns:1fr!important}.client-logo{width:104px}.logo-marquee{width:100%}}
  `;
  d.head.appendChild(st);
  const trust=d.querySelector('.trust');
  if(trust){
    const row=trust.querySelector('.trustrow,.trust-row')||trust.firstElementChild;
    if(row){
      const title=row.firstElementChild;
      const link=row.lastElementChild;
      const items=logos.concat(logos).map(([src,alt])=>`<span class="client-logo"><img src="${src}" alt="${alt}" loading="lazy"></span>`).join('');
      const marquee=d.createElement('div');
      marquee.className='logo-marquee';
      marquee.setAttribute('aria-label','USS clients');
      marquee.innerHTML=`<div class="logo-track">${items}</div>`;
      const old=row.querySelector('.logos');
      if(old)old.replaceWith(marquee); else if(link)row.insertBefore(marquee,link);
      if(title)title.textContent='Trusted across sectors';
      if(link){link.textContent='View all clients →';link.href='https://www.uss-ea.com/our-clients/';}
    }
  }
  d.querySelectorAll('.brand').forEach(b=>{
    if(!b.querySelector('img')){
      const first=b.firstElementChild;
      const img=d.createElement('img');
      img.src='/assets/uss-logo.svg';img.alt='USS — Unified Secure Systems';
      if(first)first.replaceWith(img);else b.prepend(img);
    }
  });
});
</script>
</body>
</html>
