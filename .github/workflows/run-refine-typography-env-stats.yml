name: Refine typography environments and Home 1 stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_typography_mobile_env_and_home1_stats.py'
      - '.github/workflows/run-refine-typography-env-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinements
        run: python3 scripts/refine_typography_mobile_env_and_home1_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Refine typography environments and Home 1 glass stats"
          git push
