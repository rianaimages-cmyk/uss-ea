name: Add Home dropdown

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_home_dropdown.py'
      - '.github/workflows/run-home-dropdown.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Home dropdown
        run: python3 scripts/add_home_dropdown.py
      - name: Commit navigation update
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Group Home 1 under Home dropdown"
          git push
