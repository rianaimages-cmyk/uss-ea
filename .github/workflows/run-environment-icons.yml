name: Apply environment icons

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_environment_icons.py'
      - '.github/workflows/run-environment-icons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply environment icon update
        run: python3 scripts/apply_environment_icons.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Use branded environment icons"
          git push
