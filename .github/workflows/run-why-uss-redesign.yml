name: Apply Why USS redesign

on:
  push:
    branches: [main]
    paths:
      - 'scripts/redesign_why_uss.py'
      - '.github/workflows/run-why-uss-redesign.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Why USS redesign
        run: python3 scripts/redesign_why_uss.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Redesign Why USS section"
          git push
