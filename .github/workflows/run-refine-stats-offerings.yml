name: Apply stats and offerings refinements

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_stats_and_offerings.py'
      - '.github/workflows/run-refine-stats-offerings.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinements
        run: python3 scripts/refine_stats_and_offerings.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refine stats accents and offerings overlay"
            git push
          fi
