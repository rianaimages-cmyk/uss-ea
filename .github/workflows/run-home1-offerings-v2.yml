name: Apply Home 1 offerings redesign

on:
  push:
    branches: [main]
    paths:
      - 'scripts/redesign_home1_offerings_v2.py'
      - '.github/workflows/run-home1-offerings-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Home 1 offerings redesign
        run: python3 scripts/redesign_home1_offerings_v2.py
      - name: Commit Home 1 offerings changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home1.html
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Redesign Home 1 offerings section"
          git push
