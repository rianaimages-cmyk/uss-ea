name: Apply quote pulse

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_quote_pulse.py'
      - '.github/workflows/add-quote-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply subtle quote pulse
        run: python3 scripts/add_quote_pulse.py
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply subtle quote button pulse"
            git push
          fi
