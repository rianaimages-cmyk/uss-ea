name: Repair environments and footer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_env_footer.py'
      - '.github/workflows/run-env-footer-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair environments and footer
        run: python3 scripts/repair_env_footer.py
      - name: Commit repaired HTML
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Repair environment cards and remove duplicate footer logo"
          git push
