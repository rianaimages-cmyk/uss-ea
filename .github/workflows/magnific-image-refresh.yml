name: Magnific image refresh
on:
  push:
    branches:
      - magnific-image-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magnific-image-refresh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python scripts/fetch_magnific_assets.py
      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add magnific_assets
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Fetch Magnific security imagery"
            git push origin magnific-image-refresh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: magnific-assets
          path: magnific_assets/
          retention-days: 3
