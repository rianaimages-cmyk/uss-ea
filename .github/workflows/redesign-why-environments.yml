name: Redesign Why USS and environments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-why-environments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply presentation-only redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = '06-07 REDESIGN: progressive disclosure + compact industry rail'
          css = r'''

    /* 06-07 REDESIGN: progressive disclosure + compact industry rail */
    .why-section{
      padding:104px 0 96px;
      background:linear-gradient(180deg,#ffffff 0%,#f7fafc 100%);
      overflow:hidden;
    }
    .why-head{
      display:block;
      max-width:820px;
      margin:0 0 38px;
    }
    .why-head h2{
      max-width:760px;
      margin-top:13px;
      font-size:clamp(36px,3.3vw,54px);
      line-height:1.02;
    }
    .why-grid{
      counter-reset:why;
      display:flex;
      gap:12px;
      align-items:stretch;
      margin:0 0 68px;
      min-height:330px;
    }
    .why-card{
      counter-increment:why;
      position:relative;
      flex:1 1 0;
      min-width:0;
      min-height:330px;
      padding:26px 22px 24px;
      overflow:hidden;
      border:1px solid #dfe9f2;
      border-radius:24px;
      background:linear-gradient(180deg,#f7fbfe 0%,#eef5fa 100%);
      box-shadow:none;
      transition:flex .34s cubic-bezier(.2,.7,.2,1),transform .25s ease,background .25s ease,border-color .25s ease,box-shadow .25s ease;
    }
    .why-card::before{
      content:"0" counter(why);
      position:absolute;
      top:18px;
      right:18px;
      color:rgba(20,86,141,.13);
      font-size:54px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.06em;
      pointer-events:none;
    }
    .why-card::after{
      content:"";
      position:absolute;
      left:22px;
      right:22px;
      bottom:18px;
      height:2px;
      border-radius:2px;
      background:linear-gradient(90deg,var(--uss-blue),transparent 78%);
      opacity:.38;
    }
    .why-card:first-child{
      background:linear-gradient(150deg,#0a315b,#14568d);
      border-color:transparent;
    }
    .why-card:first-child::before{color:rgba(255,255,255,.10);}
    .why-card:first-child::after{background:linear-gradient(90deg,#fff,transparent 78%);opacity:.3;}
    .why-icon{
      width:42px;
      height:42px;
      margin-bottom:auto;
      border-radius:12px;
      font-size:17px;
      box-shadow:inset 0 0 0 1px rgba(20,86,141,.06);
    }
    .why-card h3{
      position:relative;
      z-index:2;
      margin:52px 0 12px;
      max-width:210px;
      font-size:clamp(17px,1.35vw,21px);
      line-height:1.08;
    }
    .why-card p{
      position:relative;
      z-index:2;
      max-width:320px;
      margin:0;
      color:#5e6d7c;
      font-size:13.5px;
      line-height:1.65;
      opacity:0;
      transform:translateY(8px);
      max-height:0;
      overflow:hidden;
      transition:opacity .22s ease,transform .22s ease,max-height .32s ease;
    }
    .why-card:first-child p{color:rgba(255,255,255,.78);}
    .why-grid:not(:hover) .why-card:first-child{flex:1.72 1 0;box-shadow:0 24px 55px rgba(10,49,91,.16);}
    .why-grid:not(:hover) .why-card:first-child p,
    .why-card:hover p{
      opacity:1;
      transform:none;
      max-height:190px;
    }
    .why-card:hover{
      flex:1.72 1 0;
      transform:translateY(-4px);
      border-color:#bed7ea;
      background:#fff;
      box-shadow:0 22px 52px rgba(9,36,65,.11);
    }
    .why-card:first-child:hover{background:linear-gradient(150deg,#0a315b,#14568d);}

    .process-heading{
      margin:0 0 22px;
      text-align:left;
    }
    .process-heading h3{
      max-width:760px;
      font-size:clamp(25px,2.15vw,36px);
    }
    .process-journey{
      position:relative;
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:0;
      padding:0;
      overflow:hidden;
      border-radius:28px;
      background:linear-gradient(135deg,#071a30,#0a2848);
      border:1px solid rgba(20,86,141,.12);
      box-shadow:0 22px 55px rgba(8,29,52,.12);
    }
    .process-journey::before{display:none;}
    .process-step{
      position:relative;
      min-height:220px;
      padding:30px 28px 28px;
      text-align:left;
    }
    .process-step:not(:last-child)::after{
      content:"";
      position:absolute;
      top:26px;
      right:0;
      bottom:26px;
      width:1px;
      background:rgba(255,255,255,.10);
    }
    .process-number{
      width:auto;
      height:auto;
      margin:0 0 34px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 12px;
      border:1px solid rgba(97,190,247,.28);
      border-radius:999px;
      background:rgba(97,190,247,.10);
      color:#72c7fb;
      box-shadow:none;
      font-size:12px;
      font-weight:900;
      letter-spacing:.08em;
    }
    .process-step:last-child .process-number{
      color:#fff;
      background:var(--uss-red);
      border-color:var(--uss-red);
    }
    .process-step h4{
      margin-bottom:10px;
      color:#fff;
      font-size:20px;
      line-height:1.05;
    }
    .process-step p{
      max-width:230px;
      margin:0;
      color:rgba(255,255,255,.64);
      font-size:13px;
      line-height:1.62;
    }

    .environments-section{
      padding:88px 0 92px;
      background:
        radial-gradient(circle at 88% 0%,rgba(40,139,207,.15),transparent 30%),
        linear-gradient(135deg,#06172b 0%,#092541 100%);
    }
    .environments-section .section-centered-head{
      max-width:760px;
      margin:0 0 34px;
      text-align:left;
    }
    .environments-section .section-number{color:#86c9f3;}
    .environments-section .section-centered-head h2{
      margin:13px 0 13px;
      color:#fff;
      font-size:clamp(34px,3.2vw,50px);
      line-height:1.03;
    }
    .environments-section .section-centered-head p{
      color:rgba(255,255,255,.62);
      font-size:14.5px;
    }
    .environments-section .environment-grid{
      grid-template-columns:repeat(9,minmax(0,1fr));
      gap:10px;
      padding:0;
      scrollbar-color:rgba(255,255,255,.25) transparent;
    }
    .environments-section .environment-item{
      min-height:112px;
      padding:14px 8px 12px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:16px;
      background:rgba(255,255,255,.055);
      box-shadow:none;
      backdrop-filter:blur(10px);
    }
    .environments-section .environment-item:hover{
      transform:translateY(-3px);
      border-color:rgba(96,194,250,.38);
      background:rgba(255,255,255,.085);
      box-shadow:0 16px 30px rgba(0,0,0,.16);
    }
    .environments-section .environment-icon{
      width:38px;
      height:38px;
      margin-bottom:10px;
      border-radius:11px;
      background:rgba(69,183,251,.12);
      color:#68c5fb;
    }
    .environments-section .environment-item h3{
      color:#fff;
      font-size:12.5px;
      line-height:1.22;
    }
    .environments-section .environment-item::after{
      width:18px;
      bottom:8px;
      background:var(--uss-red);
      opacity:.82;
    }

    @media (max-width:980px){
      .why-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-height:0;}
      .why-card,.why-grid:not(:hover) .why-card:first-child,.why-card:hover{min-height:245px;transform:none;}
      .why-card p,.why-grid:not(:hover) .why-card:first-child p,.why-card:hover p{opacity:1;transform:none;max-height:190px;}
      .why-card h3{margin-top:38px;}
      .process-journey{grid-template-columns:repeat(2,minmax(0,1fr));}
      .process-step:nth-child(2)::after{display:none;}
      .process-step:nth-child(-n+2){border-bottom:1px solid rgba(255,255,255,.10);}
      .environments-section .environment-grid{grid-template-columns:repeat(9,130px);}
    }
    @media (max-width:680px){
      .why-section{padding:72px 0 72px;}
      .why-head{margin-bottom:28px;}
      .why-grid{grid-template-columns:1fr;gap:10px;margin-bottom:48px;}
      .why-card,.why-grid:not(:hover) .why-card:first-child,.why-card:hover{min-height:auto;padding:20px 18px 22px;border-radius:18px;}
      .why-card::before{font-size:42px;top:15px;right:16px;}
      .why-icon{margin-bottom:18px;}
      .why-card h3{margin:0 0 9px;max-width:78%;font-size:19px;}
      .why-card p{font-size:13.2px;}
      .why-card::after{left:18px;right:18px;bottom:12px;}
      .process-heading{margin-bottom:18px;}
      .process-journey{grid-template-columns:1fr;border-radius:22px;}
      .process-step{min-height:auto;padding:23px 22px 24px;}
      .process-step:not(:last-child)::after{display:block;left:22px;right:22px;top:auto;bottom:0;width:auto;height:1px;}
      .process-step:nth-child(-n+2){border-bottom:0;}
      .process-number{margin-bottom:20px;}
      .environments-section{padding:68px 0 72px;}
      .environments-section .section-centered-head{margin-bottom:26px;}
      .environments-section .environment-grid{grid-template-columns:repeat(9,118px);gap:9px;}
      .environments-section .environment-item{min-height:104px;border-radius:14px;}
    }
'''

          changed = False
          for filename in ('index.html','home1.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if marker in text:
                  continue
              at = text.rfind('</style>')
              if at < 0:
                  raise SystemExit(f'No </style> found in {filename}')
              text = text[:at] + css + '\n  ' + text[at:]
              p.write_text(text, encoding='utf-8')
              changed = True

          print('changed=', changed)
          PY
      - name: Commit redesign
        shell: bash
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Redesign Why USS and environments presentation"
          git push
