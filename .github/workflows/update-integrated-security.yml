name: Update integrated security visual

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_integrated_security.py'
      - '.github/workflows/update-integrated-security.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run updater
        run: python3 scripts/update_integrated_security.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Recreate integrated security visual in HTML and CSS"
          git push
