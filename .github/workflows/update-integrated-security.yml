name: Update integrated security visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-integrated-security.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild integrated security visual
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_css = r'''    .integration-visual{
      position:relative;
      min-height:590px;
    }
    .integration-orbit{
      position:absolute;
      inset:50% auto auto 50%;
      width:470px;
      height:470px;
      transform:translate(-50%,-50%);
      border:1px solid rgba(109,196,255,.18);
      border-radius:50%;
    }
    .integration-orbit::before,
    .integration-orbit::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(109,196,255,.13);
    }
    .integration-orbit::before{inset:64px;}
    .integration-orbit::after{inset:128px;}
    .integration-hub{
      position:absolute;
      left:50%;
      top:50%;
      width:190px;
      height:190px;
      transform:translate(-50%,-50%);
      display:grid;
      place-items:center;
      text-align:center;
      padding:24px;
      border-radius:50%;
      background:linear-gradient(145deg,#155f9d,#092d56);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 28px 70px rgba(0,0,0,.28),0 0 0 14px rgba(20,86,141,.12);
      z-index:3;
    }
    .integration-hub strong{
      color:#fff;
      font-size:20px;
      line-height:1.2;
      font-weight:900;
    }
    .integration-hub span{
      display:block;
      margin-top:8px;
      color:#9bd5ff;
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .system-node{
      position:absolute;
      width:158px;
      min-height:88px;
      display:flex;
      align-items:center;
      gap:11px;
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.075);
      border:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(14px);
      box-shadow:0 16px 36px rgba(0,0,0,.16);
      z-index:4;
    }
    .system-node i{
      flex:0 0 36px;
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      border-radius:11px;
      background:rgba(97,190,247,.14);
      color:#73c5f7;
      font-style:normal;
      font-size:17px;
      font-weight:900;
    }
    .system-node:nth-of-type(3) i,
    .system-node:nth-of-type(6) i{background:rgba(227,30,36,.16);color:#ff6b70;}
    .system-node span{color:#fff;font-size:13px;line-height:1.25;font-weight:800;}
    .node-1{left:0;top:80px;}
    .node-2{right:8px;top:56px;}
    .node-3{right:-12px;top:250px;}
    .node-4{right:50px;bottom:36px;}
    .node-5{left:52px;bottom:24px;}
    .node-6{left:-12px;top:270px;}
    .node-7{left:50%;top:-4px;transform:translateX(-50%);}
'''

          new_css = r'''    .integration-visual{
      position:relative;
      width:min(720px,100%);
      min-height:650px;
      margin-inline:auto;
      isolation:isolate;
    }
    .integration-visual::before{
      content:"";
      position:absolute;
      inset:2% -4% 0;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%,rgba(31,142,220,.18),transparent 33%),
        radial-gradient(circle at 75% 28%,rgba(67,181,250,.08),transparent 24%);
      filter:blur(2px);
      z-index:-2;
    }
    .integration-visual::after{
      content:"";
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(73,169,231,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(73,169,231,.035) 1px,transparent 1px);
      background-size:28px 28px;
      mask-image:radial-gradient(circle at 50% 50%,#000 18%,transparent 72%);
      -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 18%,transparent 72%);
      z-index:-3;
      pointer-events:none;
    }
    .integration-orbit{
      position:absolute;
      left:50%;
      top:50%;
      width:500px;
      height:500px;
      transform:translate(-50%,-50%);
      border:1px solid rgba(70,180,246,.36);
      border-radius:50%;
      box-shadow:0 0 60px rgba(23,128,200,.08) inset;
    }
    .integration-orbit::before,
    .integration-orbit::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(70,180,246,.20);
    }
    .integration-orbit::before{inset:62px;}
    .integration-orbit::after{inset:116px;}
    .integration-hub{
      position:absolute;
      left:50%;
      top:50%;
      width:214px;
      height:214px;
      transform:translate(-50%,-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:28px;
      border-radius:50%;
      background:radial-gradient(circle at 38% 28%,#1c75b7 0,#15588c 42%,#0c315a 100%);
      border:1px solid rgba(121,207,255,.72);
      box-shadow:0 0 0 12px rgba(18,89,145,.18),0 0 0 24px rgba(18,89,145,.08),0 28px 60px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.18);
      z-index:5;
    }
    .hub-shield{width:42px;height:42px;margin-bottom:12px;color:#46b7fb;filter:drop-shadow(0 0 10px rgba(70,183,251,.28));}
    .hub-shield svg,.node-icon svg{width:100%;height:100%;display:block;stroke:currentColor;}
    .integration-hub strong{color:#fff;font-size:25px;line-height:1.08;font-weight:900;letter-spacing:-.025em;}
    .integration-hub span{display:block;margin-top:14px;color:#45b7fb;font-size:11px;line-height:1.35;font-weight:900;text-transform:uppercase;letter-spacing:.16em;}
    .system-node{
      position:absolute;
      width:182px;
      min-height:118px;
      padding:16px 16px 15px;
      border-radius:15px;
      background:linear-gradient(145deg,rgba(11,52,91,.95),rgba(5,31,59,.92));
      border:1px solid rgba(76,175,236,.32);
      box-shadow:0 18px 42px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04);
      z-index:6;
      transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
    }
    .system-node:hover{transform:translateY(-4px);border-color:rgba(83,190,255,.64);box-shadow:0 22px 50px rgba(0,0,0,.28),0 0 24px rgba(32,151,226,.10);}
    .node-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .node-icon{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;padding:7px;border-radius:10px;background:rgba(36,142,205,.18);color:#47b9fb;}
    .system-node strong{color:#fff;font-size:13px;line-height:1.15;font-weight:900;}
    .system-node p{margin:0;color:rgba(255,255,255,.78);font-size:11px;line-height:1.42;font-weight:500;}
    .system-node::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#ff3e56;box-shadow:0 0 0 3px rgba(255,62,86,.10),0 0 14px rgba(255,62,86,.55);}
    .node-1{left:0;top:104px;}.node-1::after{right:-5px;bottom:8px;}
    .node-2{right:0;top:104px;}.node-2::after{left:-5px;bottom:8px;}
    .node-3{right:-18px;top:270px;}.node-3::after{left:-5px;top:50%;}
    .node-4{right:78px;bottom:4px;}.node-4::after{left:-5px;top:-5px;}
    .node-5{left:78px;bottom:4px;}.node-5::after{right:-5px;top:-5px;}
    .node-6{left:-18px;top:270px;}.node-6::after{right:-5px;top:50%;}
    .node-7{left:50%;top:0;transform:translateX(-50%);}.node-7:hover{transform:translateX(-50%) translateY(-4px);}.node-7::after{left:50%;bottom:-5px;transform:translateX(-50%);}
    .orbit-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#42baf9;box-shadow:0 0 12px rgba(66,186,249,.75);z-index:4;}
    .orbit-dot.dot-a{left:21%;top:29%;}.orbit-dot.dot-b{right:20%;top:30%;}.orbit-dot.dot-c{right:18%;bottom:28%;}.orbit-dot.dot-d{left:19%;bottom:27%;}
    @media (max-width:1180px){.integration-visual{transform:scale(.92);transform-origin:center;}}
'''

          old_html = r'''<div aria-label="Connected security systems visual" class="integration-visual">
<div class="integration-orbit"></div>
<div class="integration-hub"><strong>Integrated Security</strong><span>One operating environment</span></div>
<div class="system-node node-1"><i>◉</i><span>Surveillance</span></div>
<div class="system-node node-2"><i>⌁</i><span>Intrusion Detection</span></div>
<div class="system-node node-3"><i>✦</i><span>Fire Alarms</span></div>
<div class="system-node node-4"><i>◎</i><span>Access Control</span></div>
<div class="system-node node-5"><i>P</i><span>Parking</span></div>
<div class="system-node node-6"><i>◔</i><span>Public Address</span></div>
<div class="system-node node-7"><i>▣</i><span>Building Technologies</span></div>
</div>'''

          new_html = r'''<div aria-label="Connected security systems visual" class="integration-visual">
<div class="integration-orbit"></div>
<span class="orbit-dot dot-a"></span><span class="orbit-dot dot-b"></span><span class="orbit-dot dot-c"></span><span class="orbit-dot dot-d"></span>
<div class="integration-hub">
<div class="hub-shield"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M12 3 5.5 5.5v5.6c0 4.4 2.7 7.8 6.5 9.9 3.8-2.1 6.5-5.5 6.5-9.9V5.5L12 3Z" stroke-width="1.7"/><path d="m9.2 12 1.8 1.8 3.9-4" stroke-width="1.7"/></svg></div>
<strong>Integrated<br/>Security</strong><span>One operating<br/>environment</span>
</div>
<div class="system-node node-1"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="m4 10 11-4 2 5-11 4-2-5Z" stroke-width="1.7"/><path d="m16.5 9.5 3.5 2v4M8 14.5l-2 4" stroke-width="1.7" stroke-linecap="round"/></svg></span><strong>Surveillance</strong></div><p>Real-time monitoring and recordings</p></div>
<div class="system-node node-2"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M12 3 5.5 5.7v5.4c0 4.1 2.5 7.3 6.5 9.4 4-2.1 6.5-5.3 6.5-9.4V5.7L12 3Z" stroke-width="1.7"/><path d="m9 11.7 2 2 4-4" stroke-width="1.7"/></svg></span><strong>Intrusion<br/>Detection</strong></div><p>Detect threats and unauthorized access</p></div>
<div class="system-node node-3"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M13.5 3.8c.8 3.4-.9 4.6-2.1 6.1-1.1 1.4-1.7 2.6-1.1 4.3.5 1.4 1.7 2.3 3.2 2.4 2.3.1 4.1-1.8 4-4.2-.1-2.7-1.7-5.2-4-8.6Z" stroke-width="1.7"/><path d="M10.4 8.6C7.8 10.2 6.5 12.4 6.7 15c.2 3.1 2.6 5.2 5.6 5.2 2.7 0 4.8-1.6 5.5-4" stroke-width="1.7"/></svg></span><strong>Fire<br/>Alarms</strong></div><p>Early detection and life safety systems</p></div>
<div class="system-node node-4"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M5 4h12v16H5z" stroke-width="1.7"/><path d="M15 12h5M18 9l3 3-3 3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong>Access<br/>Control</strong></div><p>Secure access for people and vehicles</p></div>
<div class="system-node node-5"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M7 20V4h5.2a4.3 4.3 0 0 1 0 8.6H7" stroke-width="1.8"/><path d="M7 12.6h5" stroke-width="1.8"/></svg></span><strong>Parking<br/>Management</strong></div><p>Smart parking, guidance and seamless entry</p></div>
<div class="system-node node-6"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6l-5 4H4Z" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.5 1.7 1.5 4.3 0 6M18 7c2.7 2.8 2.7 7.2 0 10" stroke-width="1.7" stroke-linecap="round"/></svg></span><strong>Public<br/>Address</strong></div><p>Instant communication in critical moments</p></div>
<div class="system-node node-7"><div class="node-head"><span class="node-icon"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24"><path d="M4 20V8l6-3v15M10 20V4l10 4v12M7 11h1M7 14h1M13 9h1M17 10h1M13 13h1M17 14h1" stroke-width="1.6" stroke-linecap="round"/></svg></span><strong>Building<br/>Technologies</strong></div><p>HVAC, Lighting, Energy, Elevators &amp; more</p></div>
</div>'''

          responsive_old_1 = '      .integration-visual{min-height:540px;transform:scale(.94);transform-origin:center;}'
          responsive_new_1 = '      .integration-visual{min-height:620px;transform:scale(.88);transform-origin:center;}'
          responsive_old_2 = '      .integration-visual{min-height:500px;transform:scale(.78);margin-top:-30px;margin-bottom:-34px;}'
          responsive_new_2 = '''      .integration-visual{min-height:auto;transform:none;margin-top:0;margin-bottom:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:250px;}
      .integration-orbit{width:230px;height:230px;top:118px;}
      .integration-orbit::before{inset:32px;}
      .integration-orbit::after{inset:64px;}
      .integration-hub{top:118px;width:138px;height:138px;padding:16px;}
      .hub-shield{width:30px;height:30px;margin-bottom:8px;}
      .integration-hub strong{font-size:18px;}
      .integration-hub span{font-size:8px;margin-top:8px;}
      .system-node,.node-1,.node-2,.node-3,.node-4,.node-5,.node-6,.node-7{position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none;width:auto;min-height:118px;}
      .node-7:hover{transform:translateY(-4px);}
      .system-node::after,.orbit-dot{display:none;}'''

          changed = False
          for filename in ('index.html', 'home1.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if new_html in text:
                  continue
              if old_css not in text or old_html not in text:
                  raise SystemExit(f'Expected integrated visual block not found in {filename}')
              text = text.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
              text = text.replace(responsive_old_1, responsive_new_1, 1)
              text = text.replace(responsive_old_2, responsive_new_2, 1)
              path.write_text(text, encoding='utf-8')
              changed = True

          print('changed=', changed)
          PY
      - name: Commit updated visual
        shell: bash
        run: |
          if git diff --quiet -- index.html home1.html; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html home1.html
          git commit -m "Recreate integrated security visual in HTML and CSS"
          git push
